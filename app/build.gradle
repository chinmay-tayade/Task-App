plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
}

android {
    namespace 'com.chinmay.taskapp'
    compileSdk 35

    def localProperties = new Properties()
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))
    def GEMINI_API_KEY = localProperties.getProperty("GEMINI_API_KEY")
    def PICO_VOICE_TOKEN = localProperties.getProperty("PICO_VOICE_TOKEN")


    defaultConfig {
        applicationId "com.chinmay.taskapp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_API_KEY", "\"${GEMINI_API_KEY}\""
        buildConfigField "String", "PICO_VOICE_TOKEN", "\"${PICO_VOICE_TOKEN}\""
    }





    buildFeatures {
        compose true

    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    kapt {
        correctErrorTypes true

        arguments {
            arg("dagger.fastInit", "ENABLED")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation libs.androidx.core.ktx.v1120
    implementation libs.androidx.appcompat.v161
    implementation libs.material
    implementation libs.androidx.ui
    implementation libs.androidx.material3
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose
    implementation libs.okhttp
    implementation libs.gson
    implementation libs.hilt.android
    implementation libs.androidx.material3.android
    kapt libs.hilt.android.compiler
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.lottie.compose
    implementation libs.material.icons.extended
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    //noinspection KaptUsageInsteadOfKsp
    kapt libs.androidx.room.compiler
    implementation libs.kotlinx.coroutines.android
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor
    implementation libs.generativeai
    implementation libs.porcupine.android
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit.v115
    androidTestImplementation libs.androidx.espresso.core.v351

    //noinspection UseTomlInstead
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.3.0'
}
